[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claviger-discord-bot"
version = "0.1.0"
description = "Discord bot for consent-based and preference-driven access management."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [ "discord.py>=2.6,<3.0",
    "python-dotenv>=1.0,<2.0",]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]