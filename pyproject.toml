[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claviger-discord-bot"
version = "0.1.0"
description = "Discord bot for consent-based and preference-driven access management."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [ "discord.py>=2.6,<3.0",
    "python-dotenv>=1.0,<2.0",
    "aiosqlite>=0.20,<1.0",]

[project.scripts]
claviger = "claviger.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24,<2.0",
    "ruff>=0.9",
]
voice = [
    "discord.py[voice]>=2.6,<3.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
]
